[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jalwatch-backend"
version = "0.1.0"
description = "JalWatch Backend API - Real-Time Monitoring of Functional Household Tap Connections (SIH 2026 Problem Statement 26255)"
readme = "README.md"
authors = [{ name = "Arka! JalWatch Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pytest>=8.1.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]
requires-python = ">=3.10"
